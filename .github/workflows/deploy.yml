name: Deploy TimeDefense Web, PWA & Android APK to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Android debug signing)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Godot 4.7.2 Linux binary & export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot_bin
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-web-v1

      - name: Install Godot 4.7.2 & export templates (if not cached)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot_bin ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64

          curl -fL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates_extract

      - name: Import resources & run headless acceptance tests
        run: |
          GODOT="/tmp/godot_bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --import
          for i in $(seq 0 8); do
            echo "=== Running test_step${i}.tscn ==="
            "$GODOT" --headless --quit-after 300 "res://tests/test_step${i}.tscn" 2>&1 | tee /tmp/test_out.log
            if grep -q "SCRIPT ERROR" /tmp/test_out.log; then
              echo "Detected SCRIPT ERROR in test_step${i}.tscn!"
              exit 1
            fi
          done

      - name: Export Godot Web PWA build & Web ZIP archive
        run: |
          GODOT="/tmp/godot_bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p build/web/downloads
          touch build/web/.nojekyll
          "$GODOT" --headless --export-release "Web" build/web/index.html
          test -f build/web/index.manifest.json
          test -f build/web/index.service.worker.js
          test -f build/web/index.icon.png
          (cd build/web && zip -q -r downloads/TimeDefense-Web.zip index.html index.js index.wasm index.pck index.manifest.json index.service.worker.js index.icon.png index.apple-touch-icon.png index.audio.worklet.js index.audio.position.worklet.js 2>/dev/null || zip -q downloads/TimeDefense-Web.zip index.*)
          ls -lh build/web build/web/downloads

      - name: Configure Android debug keystore & export Android APK
        run: |
          GODOT="/tmp/godot_bin/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          mkdir -p ~/.android ~/.config/godot build/web/downloads
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          for CFG in ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.7.tres; do
            cat <<EOF > "$CFG"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="${HOME}/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          "$GODOT" --headless --verbose --export-debug "Android" build/web/downloads/TimeDefense.apk
          ls -lh build/web/downloads
          APK_SIZE=$(stat -c%s build/web/downloads/TimeDefense.apk)
          ZIP_SIZE=$(stat -c%s build/web/downloads/TimeDefense-Web.zip)
          echo "APK_SIZE=$APK_SIZE ZIP_SIZE=$ZIP_SIZE"
          test "$APK_SIZE" -gt 1000000
          test "$ZIP_SIZE" -gt 1000000

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
