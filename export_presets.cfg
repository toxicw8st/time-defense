[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" />
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\" />
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\" />
<meta name=\"mobile-web-app-capable\" content=\"yes\" />
<style>
  html, body { background-color: #0f141c !important; touch-action: manipulation; overscroll-behavior: none; }
  canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #ttd-rotate-banner {
    display: none;
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16, 22, 34, 0.92);
    color: #b8dcff;
    border: 1px solid #4fa3ff;
    border-radius: 8px;
    padding: 8px 14px;
    font: 600 13px/1.3 system-ui, -apple-system, sans-serif;
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
  }
  @media (max-width: 900px) and (orientation: portrait) {
    #ttd-rotate-banner { display: block; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.id = 'ttd-rotate-banner';
    d.textContent = 'Rotate phone to landscape for best view';
    document.body.appendChild(d);
  });
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=2
progressive_web_app/orientation=3
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.06, 0.08, 0.11, 1)
