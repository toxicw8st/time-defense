html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\" />
<meta name=\"theme-color\" content=\"#0f141c\" />
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\" />
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\" />
<meta name=\"mobile-web-app-capable\" content=\"yes\" />
<style>
  html, body { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #0f141c !important; touch-action: manipulation; overscroll-behavior: none; }
  #canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #ttd-rotate-banner {
    display: none;
    position: fixed;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16, 22, 34, 0.94);
    color: #b8dcff;
    border: 1px solid #4fa3ff;
    border-radius: 10px;
    padding: 6px 12px;
    font: 600 11px/1.25 system-ui, -apple-system, sans-serif;
    z-index: 9998;
    pointer-events: auto;
    cursor: pointer;
    white-space: nowrap;
  }
  @media (max-width: 1100px) and (orientation: portrait) {
    #ttd-rotate-banner { display: block; }
  }
  #ttd-dl-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 11, 18, 0.82);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8f1ff;
  }
  #ttd-dl-modal.open { display: flex; }
  .ttd-dl-card {
    background: #141c2b;
    border: 1px solid #4fa3ff;
    border-radius: 12px;
    padding: 18px 20px;
    width: min(92vw, 420px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
  }
  .ttd-dl-card h2 { margin: 0 0 6px; font-size: 17px; color: #7cd2ff; }
  .ttd-dl-card p { margin: 0 0 12px; font-size: 13px; color: #b7c8e0; line-height: 1.4; }
  .ttd-dl-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 8px 0;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid #4fa3ff;
    background: #1c2a42;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .ttd-dl-btn.primary { background: #1e6091; border-color: #6ce5ff; }
  .ttd-dl-btn.close { background: #262e3d; border-color: #5b6982; margin-top: 12px; }
  #ttd-pwa-status { font-size: 12px; color: #9de2b8; margin-top: 6px; min-height: 16px; }
</style>
<script>
  (function () {
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      var st = document.getElementById('ttd-pwa-status');
      if (st) st.textContent = 'PWA ready to install on your home screen.';
    });
    window.ttdTriggerBlobOrLinkDownload = function (url, filename, mimeType) {
      var st = document.getElementById('ttd-pwa-status');
      if (st) st.textContent = 'Starting download: ' + filename + '...';
      var a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', filename);
      a.setAttribute('type', mimeType);
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { document.body.removeChild(a); }, 1000);
    };
    window.ttdInstallPWA = function () {
      var st = document.getElementById('ttd-pwa-status');
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (res) {
          if (st) st.textContent = res.outcome === 'accepted' ? 'PWA installed!' : 'Install dismissed.';
          deferredPrompt = null;
        });
      } else {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (st) {
          st.textContent = isIOS
            ? 'On iPhone/iPad Safari: tap Share -> Add to Home Screen.'
            : 'In Chrome menu (3 dots): tap Install App / Add to Home Screen.';
        }
      }
    };
    window.ttdToggleLandscapeFullscreen = function () {
      var docEl = document.documentElement;
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fsEl) {
        var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(docEl)).then(function () {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function () {});
            }
          }).catch(function () {});
        }
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    };
    window.ttdOpenDownloads = function () {
      var m = document.getElementById('ttd-dl-modal');
      if (m) m.classList.add('open');
    };
    window.ttdCloseDownloads = function () {
      var m = document.getElementById('ttd-dl-modal');
      if (m) m.classList.remove('open');
    };
    if ('serviceWorker' in navigator) {
      var hadController = !!navigator.serviceWorker.controller;
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (hadController && !reloaded) {
          reloaded = true;
          window.location.reload();
        }
      });
      navigator.serviceWorker.register('./index.service.worker.js').then(function (reg) {
        if (reg && reg.update) reg.update().catch(function () {});
      }).catch(function () {});
    }
    document.addEventListener('DOMContentLoaded', function () {
      var rot = document.createElement('div');
      rot.id = 'ttd-rotate-banner';
      rot.textContent = 'Portrait view active - Tap here or rotate for 20:9 Widescreen';
      rot.addEventListener('click', function () { window.ttdToggleLandscapeFullscreen(); });
      document.body.appendChild(rot);

      var modal = document.createElement('div');
      modal.id = 'ttd-dl-modal';
      modal.innerHTML =
        '<div class=\"ttd-dl-card\">' +
        '<h2>TimeDefense - Install & Downloads</h2>' +
        '<p>Install as an offline Web App (PWA) or download the standalone Android APK / Web ZIP.</p>' +
        '<button type=\"button\" class=\"ttd-dl-btn primary\" onclick=\"window.ttdInstallPWA()\">Install PWA App (Offline Cache)</button>' +
        '<a class=\"ttd-dl-btn\" href=\"./downloads/TimeDefense.apk\" download=\"TimeDefense.apk\" type=\"application/vnd.android.package-archive\" onclick=\"var st=document.getElementById(\\'ttd-pwa-status\\');if(st)st.textContent=\\'Downloading TimeDefense.apk...\\';\">Download Android APK (Pixel / Android)</a>' +
        '<a class=\"ttd-dl-btn\" href=\"./downloads/TimeDefense-Web.zip\" download=\"TimeDefense-Web.zip\" type=\"application/zip\" onclick=\"var st=document.getElementById(\\'ttd-pwa-status\\');if(st)st.textContent=\\'Downloading TimeDefense-Web.zip...\\';\">Download Web Build (.zip)</a>' +
        '<div id=\"ttd-pwa-status\">Service worker & offline cache active once loaded.</div>' +
        '<button type=\"button\" class=\"ttd-dl-btn close\" onclick=\"window.ttdCloseDownloads()\">Back to Game</button>' +
        '</div>';
      document.body.appendChild(modal);
    });
  })();
</script>"
